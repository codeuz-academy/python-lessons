<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 640" role="img" aria-labelledby="title desc">
  <title id="title">AI Platform Flow Diagram</title>
  <desc id="desc">Animated SVG showing GPU, xPUs, NPU feeding an LLM platform and token intelligence to a developer.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06080f"/>
      <stop offset="100%" stop-color="#03050a"/>
    </linearGradient>

    <linearGradient id="pipeIn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2ecb70"/>
      <stop offset="50%" stop-color="#24c0b9"/>
      <stop offset="100%" stop-color="#6c63ff"/>
    </linearGradient>

    <linearGradient id="pipeOut" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6c63ff"/>
      <stop offset="100%" stop-color="#b8b5ff"/>
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .label {
        font-family: "Segoe UI", "Inter", "Arial", sans-serif;
        font-weight: 700;
        letter-spacing: 0.2px;
      }

      .t-main {
        fill: #a294ff;
      }

      .t-sub {
        fill: #7f86a8;
      }

      .panel {
        fill: #0b0f1f;
        stroke: #323a90;
        stroke-width: 3.2;
      }

      .chip-gpu {
        fill: #102013;
        stroke: #5d9f1d;
        stroke-width: 3;
      }

      .chip-xpu {
        fill: #0d1528;
        stroke: #2f76df;
        stroke-width: 3;
      }

      .chip-npu {
        fill: #0b201d;
        stroke: #1cae92;
        stroke-width: 3;
      }

      .pipe {
        fill: none;
        stroke-linecap: round;
        stroke-width: 4;
      }

      .pulse {
        filter: url(#softGlow);
      }

      .blink {
        animation: blink 2.3s infinite ease-in-out;
      }

      .node-breathe {
        transform-origin: center;
        animation: breathe 2.2s infinite ease-in-out;
      }

      .spin {
        transform-origin: center;
        animation: spin 5.5s linear infinite;
      }

      .spin-rev {
        transform-origin: center;
        animation: spin 7.5s linear infinite reverse;
      }

      @keyframes blink {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }

      @keyframes breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }

      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <rect x="0" y="0" width="1800" height="640" fill="url(#bgGrad)"/>
  <rect x="56" y="52" width="1688" height="536" rx="28" fill="none" stroke="#1a1f31" stroke-width="2.2"/>

  <!-- Left chips -->
  <g transform="translate(160,140)">
    <rect class="chip-gpu" x="0" y="0" width="90" height="90" rx="12"/>
    <g fill="#5d9f1d">
      <rect x="18" y="18" width="10" height="10" rx="2"/>
      <rect x="32" y="18" width="10" height="10" rx="2"/>
      <rect x="46" y="18" width="10" height="10" rx="2"/>
      <rect x="60" y="18" width="10" height="10" rx="2"/>
      <rect x="18" y="32" width="10" height="10" rx="2"/>
      <rect x="32" y="32" width="10" height="10" rx="2"/>
      <rect x="46" y="32" width="10" height="10" rx="2"/>
      <rect x="60" y="32" width="10" height="10" rx="2"/>
      <rect x="18" y="46" width="10" height="10" rx="2"/>
      <rect x="32" y="46" width="10" height="10" rx="2"/>
      <rect x="46" y="46" width="10" height="10" rx="2"/>
      <rect x="60" y="46" width="10" height="10" rx="2"/>
      <rect x="18" y="60" width="10" height="10" rx="2"/>
      <rect x="32" y="60" width="10" height="10" rx="2"/>
      <rect x="46" y="60" width="10" height="10" rx="2"/>
      <rect x="60" y="60" width="10" height="10" rx="2"/>
    </g>
    <text class="label" x="45" y="122" fill="#6dbd1c" font-size="38" text-anchor="middle">GPU</text>
  </g>

  <g transform="translate(160,268)">
    <rect class="chip-xpu" x="0" y="0" width="90" height="90" rx="12"/>
    <rect x="18" y="24" width="18" height="18" rx="3" fill="#2f76df" opacity="0.6"/>
    <rect x="35" y="40" width="18" height="18" rx="3" fill="#6c63ff" opacity="0.72"/>
    <rect x="52" y="56" width="18" height="18" rx="3" fill="#9b73ff" opacity="0.62"/>
    <text class="label" x="45" y="122" fill="#2f76df" font-size="38" text-anchor="middle">xPUs</text>
  </g>

  <g transform="translate(160,396)">
    <rect class="chip-npu" x="0" y="0" width="90" height="90" rx="12"/>
    <circle cx="45" cy="45" r="24" fill="none" stroke="#1cae92" stroke-width="3"/>
    <circle class="blink" cx="30" cy="45" r="7" fill="#1cae92"/>
    <circle cx="45" cy="57" r="7" fill="#0f7f72"/>
    <circle class="blink" cx="58" cy="33" r="5" fill="#1cae92"/>
    <text class="label" x="45" y="122" fill="#1ec4a5" font-size="38" text-anchor="middle">NPU</text>
  </g>

  <!-- Inbound pipes -->
  <path class="pipe pulse" d="M260 184 H330 V312 H590" stroke="url(#pipeIn)"/>
  <path class="pipe pulse" d="M260 312 H590" stroke="url(#pipeIn)"/>
  <path class="pipe pulse" d="M260 440 H330 V312 H590" stroke="url(#pipeIn)"/>

  <!-- Inbound moving dots -->
  <circle class="node-breathe" r="7" fill="#7fd000">
    <animateMotion dur="2.8s" repeatCount="indefinite" path="M260 184 H330 V312 H590"/>
  </circle>
  <circle class="node-breathe" r="7" fill="#20c8b6">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M260 312 H590"/>
  </circle>
  <circle class="node-breathe" r="7" fill="#6c63ff">
    <animateMotion dur="3.6s" repeatCount="indefinite" path="M260 440 H330 V312 H590"/>
  </circle>

  <!-- LLM platform -->
  <g transform="translate(610,122)">
    <rect class="panel" x="0" y="0" width="640" height="356" rx="20"/>
    <text class="label t-main" x="320" y="48" font-size="50" text-anchor="middle">LLM</text>
    <text class="label t-main" x="160" y="76" font-size="42" text-anchor="middle" opacity="0.85">Data</text>
    <text class="label t-main" x="486" y="92" font-size="42" text-anchor="middle" opacity="0.85">Token</text>

    <!-- Data card -->
    <rect x="64" y="112" width="170" height="164" rx="14" fill="#111429" stroke="#333b96" stroke-width="3"/>
    <g stroke="#4049ad" stroke-width="4" stroke-linecap="round">
      <line x1="96" y1="154" x2="126" y2="154"/>
      <line x1="96" y1="186" x2="126" y2="186"/>
      <line x1="96" y1="218" x2="126" y2="218"/>
      <line x1="96" y1="250" x2="126" y2="250"/>
      <line x1="142" y1="154" x2="182" y2="154"/>
      <line x1="142" y1="186" x2="182" y2="186"/>
      <line x1="142" y1="218" x2="182" y2="218"/>
      <line x1="142" y1="250" x2="182" y2="250"/>
    </g>

    <!-- Network card -->
    <rect x="330" y="82" width="260" height="222" rx="18" fill="#191d3f" stroke="#3f47ac" stroke-width="4"/>
    <g stroke="#3f47ac" stroke-width="3.2" fill="none" opacity="0.9">
      <line x1="394" y1="144" x2="426" y2="212"/>
      <line x1="394" y1="144" x2="470" y2="208"/>
      <line x1="470" y1="208" x2="526" y2="144"/>
      <line x1="526" y1="144" x2="558" y2="212"/>
      <line x1="470" y1="208" x2="470" y2="102"/>
      <line x1="470" y1="208" x2="470" y2="258"/>
    </g>
    <g fill="#4d58c5">
      <circle cx="394" cy="144" r="14" class="blink"/>
      <circle cx="426" cy="212" r="14"/>
      <circle cx="470" cy="208" r="16" class="node-breathe"/>
      <circle cx="526" cy="144" r="14" class="blink"/>
      <circle cx="558" cy="212" r="14"/>
      <circle cx="470" cy="102" r="14"/>
      <circle cx="470" cy="258" r="12"/>
      <circle cx="526" cy="258" r="10"/>
    </g>

    <!-- Token card -->
    <rect x="690" y="132" width="164" height="130" rx="12" fill="#111429" stroke="#333b96" stroke-width="3"
      transform="translate(-30,0)"/>
    <g fill="#4f45a1" opacity="0.9">
      <rect x="688" y="162" width="28" height="20" rx="3" transform="translate(-30,0)"/>
      <rect x="724" y="162" width="28" height="20" rx="3" transform="translate(-30,0)"/>
      <rect x="760" y="162" width="28" height="20" rx="3" transform="translate(-30,0)"/>
      <rect x="796" y="162" width="20" height="20" rx="3" transform="translate(-30,0)"/>
      <rect x="688" y="192" width="36" height="18" rx="3" transform="translate(-30,0)"/>
      <rect x="730" y="192" width="30" height="18" rx="3" transform="translate(-30,0)"/>
      <rect x="766" y="192" width="30" height="18" rx="3" transform="translate(-30,0)"/>
      <rect x="802" y="192" width="26" height="18" rx="3" transform="translate(-30,0)"/>
      <rect x="688" y="220" width="20" height="18" rx="3" transform="translate(-30,0)"/>
      <rect x="714" y="220" width="32" height="18" rx="3" transform="translate(-30,0)"/>
    </g>

    <!-- Internal flow -->
    <path class="pipe" d="M250 194 H328" stroke="#6f66d8"/>
    <path class="pipe" d="M594 194 H656" stroke="#6f66d8"/>
    <circle cx="290" cy="194" r="7" fill="#ab98ff"/>
    <circle cx="606" cy="194" r="7" fill="#ab98ff"/>

    <text class="label t-main" x="320" y="328" font-size="54" text-anchor="middle">ThakiCloud AI Platform</text>
  </g>

  <!-- Outbound pipe -->
  <path class="pipe pulse" d="M1260 312 H1512" stroke="url(#pipeOut)"/>
  <circle class="node-breathe" r="7" fill="#7f78ff">
    <animateMotion dur="2.7s" repeatCount="indefinite" path="M1260 312 H1512"/>
  </circle>
  <circle class="node-breathe" r="7" fill="#b8b5ff">
    <animateMotion dur="2.7s" repeatCount="indefinite" begin="0.9s" path="M1260 312 H1512"/>
  </circle>

  <!-- Intelligence text -->
  <text class="label t-main" x="1392" y="266" font-size="52" text-anchor="middle">Token Intelligence</text>
  <text class="label" x="1392" y="312" fill="#6f66d8" font-size="48" text-anchor="middle">(xPUaaS)</text>

  <!-- Developer block -->
  <g transform="translate(1512,132)">
    <rect class="panel" x="0" y="0" width="210" height="336" rx="16"/>

    <!-- spinning ring icon -->
    <g transform="translate(105,102)">
      <circle cx="0" cy="0" r="46" fill="#10132a" stroke="#4047a8" stroke-width="4"/>
      <g class="spin" fill="#4b56ca" opacity="0.9">
        <rect x="-6" y="-62" width="12" height="18" rx="2"/>
        <rect x="-6" y="44" width="12" height="18" rx="2"/>
        <rect x="44" y="-6" width="18" height="12" rx="2"/>
        <rect x="-62" y="-6" width="18" height="12" rx="2"/>
        <rect x="34" y="-44" width="14" height="12" rx="2" transform="rotate(45)"/>
        <rect x="-48" y="-44" width="14" height="12" rx="2" transform="rotate(315)"/>
        <rect x="34" y="32" width="14" height="12" rx="2" transform="rotate(315)"/>
        <rect x="-48" y="32" width="14" height="12" rx="2" transform="rotate(45)"/>
      </g>
      <circle cx="0" cy="0" r="30" fill="none" stroke="#2f74dd" stroke-width="5" class="spin-rev"/>
      <circle cx="0" cy="0" r="20" fill="#163138" stroke="#1fa36d" stroke-width="4"/>
      <path d="M-10 0 L-2 8 L12 -8" fill="none" stroke="#31c46e" stroke-width="5" stroke-linecap="round"
        stroke-linejoin="round"/>
    </g>

    <!-- status dots -->
    <g transform="translate(28,252)">
      <line x1="24" y1="20" x2="138" y2="20" stroke="#3f47a8" stroke-width="4"/>
      <circle cx="24" cy="20" r="12" fill="#2cb66a" class="blink"/>
      <circle cx="81" cy="20" r="12" fill="#3941a1"/>
      <circle cx="138" cy="20" r="12" fill="#3941a1"/>
      <line x1="36" y1="20" x2="69" y2="20" stroke="#3f47a8" stroke-width="4" stroke-dasharray="8 8"/>
      <line x1="93" y1="20" x2="126" y2="20" stroke="#3f47a8" stroke-width="4" stroke-dasharray="8 8"/>
    </g>

    <text class="label t-main" x="105" y="396" font-size="54" text-anchor="middle">Developer</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" role="img" aria-label="Heap pop operation">
  <rect width="480" height="260" rx="8" fill="#f8fafc"/>
  <text x="24" y="18" font-size="13" font-family="Arial, sans-serif" fill="#dc2626" font-weight="600">pop() - remove min</text>
  <text x="24" y="38" font-size="11" font-family="Arial, sans-serif" fill="#94a3b8" font-weight="600">1. Swap root with last, remove last</text>
  <rect x="24" y="48" width="42" height="28" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="45" y="67" font-size="14" font-family="Arial, sans-serif" fill="#dc2626" text-anchor="middle" font-weight="600">4</text>
  <rect x="70" y="48" width="42" height="28" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="91" y="67" font-size="14" font-family="Arial, sans-serif" fill="#1e293b" text-anchor="middle">7</text>
  <rect x="116" y="48" width="42" height="28" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="137" y="67" font-size="14" font-family="Arial, sans-serif" fill="#1e293b" text-anchor="middle">5</text>
  <rect x="162" y="48" width="42" height="28" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="183" y="67" font-size="14" font-family="Arial, sans-serif" fill="#1e293b" text-anchor="middle">12</text>
  <rect x="208" y="48" width="42" height="28" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="229" y="67" font-size="14" font-family="Arial, sans-serif" fill="#1e293b" text-anchor="middle">15</text>
  <rect x="254" y="48" width="42" height="28" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="275" y="67" font-size="14" font-family="Arial, sans-serif" fill="#854d0e" text-anchor="middle">9</text>
  <line x1="315" y1="62" x2="340" y2="62" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="350" y="60" font-size="11" font-family="Arial, sans-serif" fill="#dc2626">returns 4</text>
  <text x="350" y="74" font-size="11" font-family="Arial, sans-serif" fill="#64748b">9 moves to root</text>
  <text x="24" y="102" font-size="11" font-family="Arial, sans-serif" fill="#94a3b8" font-weight="600">2. Sift down (swap with smaller child)</text>
  <line x1="170" y1="132" x2="120" y2="162" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="190" y1="132" x2="240" y2="162" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="108" y1="192" x2="80" y2="218" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="132" y1="192" x2="156" y2="218" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="180" cy="120" r="20" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="180" y="126" font-size="14" font-family="Arial, sans-serif" fill="#854d0e" text-anchor="middle" font-weight="600">9</text>
  <circle cx="116" cy="178" r="20" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="116" y="184" font-size="14" font-family="Arial, sans-serif" fill="#1e293b" text-anchor="middle">7</text>
  <circle cx="248" cy="178" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="248" y="184" font-size="14" font-family="Arial, sans-serif" fill="#15803d" text-anchor="middle" font-weight="600">5</text>
  <circle cx="72" cy="234" r="18" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="72" y="240" font-size="13" font-family="Arial, sans-serif" fill="#1e293b" text-anchor="middle">12</text>
  <circle cx="160" cy="234" r="18" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="160" y="240" font-size="13" font-family="Arial, sans-serif" fill="#1e293b" text-anchor="middle">15</text>
  <path d="M196,128 C220,135 240,148 248,158" stroke="#16a34a" stroke-width="1.5" fill="none" stroke-dasharray="5 3" marker-end="url(#ag)"/>
  <text x="280" y="146" font-size="10" font-family="Arial, sans-serif" fill="#16a34a">9 &gt; 5, swap</text>
  <text x="320" y="126" font-size="11" font-family="Arial, sans-serif" fill="#64748b">Result: [5, 7, 9, 12, 15]</text>
  <text x="320" y="142" font-size="11" font-family="Arial, sans-serif" fill="#94a3b8">O(log n)</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 z" fill="#64748b"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 z" fill="#16a34a"/></marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Array operations</title>
  <desc id="desc">Shows append, insert, and remove operations on an array.</desc>
  <rect width="1200" height="420" fill="#f7fbfd"/>
  <text x="40" y="48" font-size="28" font-family="Arial" fill="#0e4f62" font-weight="700">Array Operations: append, insert, remove</text>

  <text x="40" y="95" font-size="20" font-family="Arial" fill="#2b5564" font-weight="700">Initial Array</text>
  <rect x="40" y="120" width="120" height="62" rx="8" fill="#ffffff" stroke="#7fb0bf" stroke-width="2"/>
  <rect x="160" y="120" width="120" height="62" rx="8" fill="#ffffff" stroke="#7fb0bf" stroke-width="2"/>
  <rect x="280" y="120" width="120" height="62" rx="8" fill="#ffffff" stroke="#7fb0bf" stroke-width="2"/>
  <rect x="400" y="120" width="120" height="62" rx="8" fill="#ffffff" stroke="#7fb0bf" stroke-width="2"/>
  <text x="95" y="157" font-size="28" font-family="Arial" fill="#173845" text-anchor="middle">10</text>
  <text x="215" y="157" font-size="28" font-family="Arial" fill="#173845" text-anchor="middle">20</text>
  <text x="335" y="157" font-size="28" font-family="Arial" fill="#173845" text-anchor="middle">30</text>
  <text x="455" y="157" font-size="28" font-family="Arial" fill="#173845" text-anchor="middle">40</text>
  <text x="95" y="205" font-size="16" font-family="Arial" fill="#44606b" text-anchor="middle">index 0</text>
  <text x="215" y="205" font-size="16" font-family="Arial" fill="#44606b" text-anchor="middle">index 1</text>
  <text x="335" y="205" font-size="16" font-family="Arial" fill="#44606b" text-anchor="middle">index 2</text>
  <text x="455" y="205" font-size="16" font-family="Arial" fill="#44606b" text-anchor="middle">index 3</text>

  <line x1="560" y1="145" x2="650" y2="145" stroke="#0b6f7d" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="605" y="132" font-size="17" font-family="Arial" fill="#0b6f7d" text-anchor="middle">append(50)</text>

  <rect x="680" y="120" width="100" height="62" rx="8" fill="#e6f5f8" stroke="#0b6f7d" stroke-width="2"/>
  <rect x="780" y="120" width="100" height="62" rx="8" fill="#e6f5f8" stroke="#0b6f7d" stroke-width="2"/>
  <rect x="880" y="120" width="100" height="62" rx="8" fill="#e6f5f8" stroke="#0b6f7d" stroke-width="2"/>
  <rect x="980" y="120" width="100" height="62" rx="8" fill="#e6f5f8" stroke="#0b6f7d" stroke-width="2"/>
  <rect x="1080" y="120" width="100" height="62" rx="8" fill="#fbead6" stroke="#c97300" stroke-width="2"/>
  <text x="730" y="157" font-size="24" font-family="Arial" fill="#173845" text-anchor="middle">10</text>
  <text x="830" y="157" font-size="24" font-family="Arial" fill="#173845" text-anchor="middle">20</text>
  <text x="930" y="157" font-size="24" font-family="Arial" fill="#173845" text-anchor="middle">30</text>
  <text x="1030" y="157" font-size="24" font-family="Arial" fill="#173845" text-anchor="middle">40</text>
  <text x="1130" y="157" font-size="24" font-family="Arial" fill="#8e4a00" text-anchor="middle">50</text>
  <text x="1130" y="205" font-size="15" font-family="Arial" fill="#8e4a00" text-anchor="middle">new tail</text>

  <text x="40" y="270" font-size="20" font-family="Arial" fill="#2b5564" font-weight="700">insert(1, 15) and remove(index=3)</text>
  <rect x="40" y="292" width="95" height="56" rx="8" fill="#ffffff" stroke="#7fb0bf" stroke-width="2"/>
  <rect x="135" y="292" width="95" height="56" rx="8" fill="#fbead6" stroke="#c97300" stroke-width="2"/>
  <rect x="230" y="292" width="95" height="56" rx="8" fill="#ffffff" stroke="#7fb0bf" stroke-width="2"/>
  <rect x="325" y="292" width="95" height="56" rx="8" fill="#ffffff" stroke="#7fb0bf" stroke-width="2"/>
  <rect x="420" y="292" width="95" height="56" rx="8" fill="#f2f7fa" stroke="#bed3da" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="88" y="326" font-size="23" font-family="Arial" fill="#173845" text-anchor="middle">10</text>
  <text x="183" y="326" font-size="23" font-family="Arial" fill="#8e4a00" text-anchor="middle">15</text>
  <text x="278" y="326" font-size="23" font-family="Arial" fill="#173845" text-anchor="middle">20</text>
  <text x="373" y="326" font-size="23" font-family="Arial" fill="#173845" text-anchor="middle">30</text>
  <text x="468" y="326" font-size="18" font-family="Arial" fill="#6a808a" text-anchor="middle">40 removed</text>

  <line x1="530" y1="318" x2="640" y2="318" stroke="#b75400" stroke-width="4" marker-end="url(#arrowWarm)"/>
  <text x="585" y="303" font-size="17" font-family="Arial" fill="#b75400" text-anchor="middle">elements shift right/left</text>

  <rect x="680" y="282" width="470" height="88" rx="12" fill="#ffffff" stroke="#a9c2cb" stroke-width="2"/>
  <text x="705" y="314" font-size="20" font-family="Arial" fill="#173845" font-weight="700">Complexity Notes</text>
  <text x="705" y="341" font-size="17" font-family="Arial" fill="#355660">append: O(1) amortized, insert/remove middle: O(n)</text>
  <text x="705" y="362" font-size="17" font-family="Arial" fill="#355660">read/write by index: O(1)</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0b6f7d"/>
    </marker>
    <marker id="arrowWarm" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b75400"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Matrix indexing and row-major mapping</title>
  <desc id="desc">A two-dimensional matrix with row and column indexes and the equivalent one-dimensional row-major storage mapping.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .headline { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .sub { font: 700 18px Arial, sans-serif; fill: #1e293b; }
      .txt { font: 600 16px Arial, sans-serif; fill: #334155; }
      .tiny { font: 500 14px Arial, sans-serif; fill: #475569; }
      .cell { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
      .highlight { fill: #dbeafe; stroke: #2563eb; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#head); }
    </style>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="560" />
  <text class="headline" x="40" y="50">2-D array access and row-major storage</text>

  <text class="sub" x="60" y="110">Matrix A (3 rows x 4 cols)</text>

  <!-- Grid -->
  <g transform="translate(60,140)">
    <!-- row labels -->
    <text class="txt" x="-30" y="35">0</text>
    <text class="txt" x="-30" y="95">1</text>
    <text class="txt" x="-30" y="155">2</text>
    <!-- col labels -->
    <text class="txt" x="46" y="-14">0</text>
    <text class="txt" x="126" y="-14">1</text>
    <text class="txt" x="206" y="-14">2</text>
    <text class="txt" x="286" y="-14">3</text>

    <!-- cells -->
    <rect class="cell" x="0" y="0" width="80" height="60" />
    <rect class="cell" x="80" y="0" width="80" height="60" />
    <rect class="cell" x="160" y="0" width="80" height="60" />
    <rect class="cell" x="240" y="0" width="80" height="60" />
    <rect class="cell" x="0" y="60" width="80" height="60" />
    <rect class="cell highlight" x="80" y="60" width="80" height="60" />
    <rect class="cell" x="160" y="60" width="80" height="60" />
    <rect class="cell" x="240" y="60" width="80" height="60" />
    <rect class="cell" x="0" y="120" width="80" height="60" />
    <rect class="cell" x="80" y="120" width="80" height="60" />
    <rect class="cell" x="160" y="120" width="80" height="60" />
    <rect class="cell" x="240" y="120" width="80" height="60" />

    <text class="txt" x="18" y="36">A[0,0]</text>
    <text class="txt" x="98" y="36">A[0,1]</text>
    <text class="txt" x="178" y="36">A[0,2]</text>
    <text class="txt" x="258" y="36">A[0,3]</text>

    <text class="txt" x="18" y="96">A[1,0]</text>
    <text class="txt" x="98" y="96">A[1,1]</text>
    <text class="txt" x="178" y="96">A[1,2]</text>
    <text class="txt" x="258" y="96">A[1,3]</text>

    <text class="txt" x="18" y="156">A[2,0]</text>
    <text class="txt" x="98" y="156">A[2,1]</text>
    <text class="txt" x="178" y="156">A[2,2]</text>
    <text class="txt" x="258" y="156">A[2,3]</text>
  </g>

  <line class="arrow" x1="390" y1="260" x2="510" y2="260" />

  <text class="sub" x="540" y="110">Underlying 1-D storage (row-major)</text>

  <!-- Flat storage -->
  <g transform="translate(540,150)">
    <rect class="cell" x="0" y="0" width="70" height="62" />
    <rect class="cell" x="70" y="0" width="70" height="62" />
    <rect class="cell" x="140" y="0" width="70" height="62" />
    <rect class="cell" x="210" y="0" width="70" height="62" />
    <rect class="cell" x="280" y="0" width="70" height="62" />
    <rect class="cell highlight" x="350" y="0" width="70" height="62" />
    <rect class="cell" x="420" y="0" width="70" height="62" />
    <rect class="cell" x="490" y="0" width="70" height="62" />
    <rect class="cell" x="560" y="0" width="70" height="62" />
    <rect class="cell" x="630" y="0" width="70" height="62" />
    <rect class="cell" x="700" y="0" width="70" height="62" />
    <rect class="cell" x="770" y="0" width="70" height="62" />

    <text class="tiny" x="26" y="-10">0</text>
    <text class="tiny" x="96" y="-10">1</text>
    <text class="tiny" x="166" y="-10">2</text>
    <text class="tiny" x="236" y="-10">3</text>
    <text class="tiny" x="306" y="-10">4</text>
    <text class="tiny" x="376" y="-10">5</text>
    <text class="tiny" x="446" y="-10">6</text>
    <text class="tiny" x="516" y="-10">7</text>
    <text class="tiny" x="586" y="-10">8</text>
    <text class="tiny" x="656" y="-10">9</text>
    <text class="tiny" x="724" y="-10">10</text>
    <text class="tiny" x="794" y="-10">11</text>

    <text class="tiny" x="11" y="38">A[0,0]</text>
    <text class="tiny" x="81" y="38">A[0,1]</text>
    <text class="tiny" x="151" y="38">A[0,2]</text>
    <text class="tiny" x="221" y="38">A[0,3]</text>
    <text class="tiny" x="291" y="38">A[1,0]</text>
    <text class="tiny" x="361" y="38">A[1,1]</text>
    <text class="tiny" x="431" y="38">A[1,2]</text>
    <text class="tiny" x="501" y="38">A[1,3]</text>
    <text class="tiny" x="571" y="38">A[2,0]</text>
    <text class="tiny" x="641" y="38">A[2,1]</text>
    <text class="tiny" x="711" y="38">A[2,2]</text>
    <text class="tiny" x="781" y="38">A[2,3]</text>
  </g>

  <text class="sub" x="540" y="300">Index mapping</text>
  <text class="txt" x="540" y="336">flat_index = row * ncols + col</text>
  <text class="txt" x="540" y="368">Example: A[1,1] -> 1 * 4 + 1 = 5</text>
  <text class="txt" x="540" y="400">A[1,1] is stored at flat slot 5</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">BST operations</title>
  <desc id="desc">Shows insert search and delete in a binary search tree.</desc>
  <rect width="1200" height="430" fill="#f7fbfd"/>
  <text x="40" y="50" font-size="30" font-family="Arial" fill="#0e4f62" font-weight="700">Binary Search Tree: insert, search, delete</text>

  <line x1="280" y1="150" x2="198" y2="194" stroke="#0b6f7d" stroke-width="3"/>
  <line x1="320" y1="150" x2="402" y2="194" stroke="#0b6f7d" stroke-width="3"/>
  <line x1="166" y1="251" x2="132" y2="292" stroke="#0b6f7d" stroke-width="3"/>
  <line x1="194" y1="251" x2="228" y2="292" stroke="#0b6f7d" stroke-width="3"/>
  <line x1="406" y1="251" x2="372" y2="292" stroke="#0b6f7d" stroke-width="3"/>
  <line x1="434" y1="251" x2="468" y2="292" stroke="#0b6f7d" stroke-width="3"/>

  <circle cx="300" cy="120" r="36" fill="#ffffff" stroke="#7fb0bf" stroke-width="3"/>
  <text x="300" y="128" font-size="26" font-family="Arial" fill="#173845" text-anchor="middle">50</text>

  <circle cx="180" cy="220" r="34" fill="#ffffff" stroke="#7fb0bf" stroke-width="3"/>
  <text x="180" y="228" font-size="24" font-family="Arial" fill="#173845" text-anchor="middle">30</text>
  <circle cx="420" cy="220" r="34" fill="#ffffff" stroke="#7fb0bf" stroke-width="3"/>
  <text x="420" y="228" font-size="24" font-family="Arial" fill="#173845" text-anchor="middle">70</text>

  <circle cx="120" cy="320" r="30" fill="#ffffff" stroke="#7fb0bf" stroke-width="3"/>
  <text x="120" y="327" font-size="22" font-family="Arial" fill="#173845" text-anchor="middle">20</text>
  <circle cx="240" cy="320" r="30" fill="#ffffff" stroke="#7fb0bf" stroke-width="3"/>
  <text x="240" y="327" font-size="22" font-family="Arial" fill="#173845" text-anchor="middle">40</text>
  <circle cx="360" cy="320" r="30" fill="#ffffff" stroke="#7fb0bf" stroke-width="3"/>
  <text x="360" y="327" font-size="22" font-family="Arial" fill="#173845" text-anchor="middle">60</text>
  <circle cx="480" cy="320" r="30" fill="#ffffff" stroke="#7fb0bf" stroke-width="3"/>
  <text x="480" y="327" font-size="22" font-family="Arial" fill="#173845" text-anchor="middle">80</text>

  <line x1="560" y1="122" x2="645" y2="122" stroke="#0b6f7d" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="603" y="103" font-size="17" font-family="Arial" fill="#0b6f7d" text-anchor="middle">insert(65)</text>

  <circle cx="710" cy="200" r="30" fill="#fbead6" stroke="#c97300" stroke-width="3"/>
  <text x="710" y="207" font-size="22" font-family="Arial" fill="#8e4a00" text-anchor="middle">65</text>
  <line x1="675" y1="211" x2="615" y2="278" stroke="#c97300" stroke-width="3" marker-end="url(#arrowWarm)"/>
  <text x="632" y="247" font-size="16" font-family="Arial" fill="#8e4a00">go right to 70, left to 60, right to 65</text>

  <line x1="560" y1="290" x2="645" y2="290" stroke="#0b6f7d" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="603" y="272" font-size="17" font-family="Arial" fill="#0b6f7d" text-anchor="middle">search(60)</text>
  <rect x="660" y="262" width="190" height="58" rx="10" fill="#e6f5f8" stroke="#0b6f7d" stroke-width="2"/>
  <text x="755" y="298" font-size="20" font-family="Arial" fill="#173845" text-anchor="middle">path: 50 -> 70 -> 60</text>

  <line x1="860" y1="290" x2="935" y2="290" stroke="#b75400" stroke-width="4" marker-end="url(#arrowWarm)"/>
  <text x="897" y="272" font-size="17" font-family="Arial" fill="#b75400" text-anchor="middle">delete(70)</text>
  <rect x="950" y="240" width="220" height="140" rx="12" fill="#ffffff" stroke="#a9c2cb" stroke-width="2"/>
  <text x="975" y="276" font-size="18" font-family="Arial" fill="#355660">Replace with in-order successor</text>
  <text x="975" y="305" font-size="18" font-family="Arial" fill="#355660">(smallest in right subtree).</text>
  <text x="975" y="337" font-size="18" font-family="Arial" fill="#355660">Average operations: O(log n)</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0b6f7d"/>
    </marker>
    <marker id="arrowWarm" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b75400"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" role="img" aria-label="Hash table set operation">
  <rect width="440" height="200" rx="8" fill="#f8fafc"/>
  <text x="24" y="18" font-size="13" font-family="Arial, sans-serif" fill="#475569" font-weight="600">set("cat", 9)</text>
  <rect x="24" y="30" width="56" height="140" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="24" y1="65" x2="80" y2="65" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="24" y1="100" x2="80" y2="100" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="24" y1="135" x2="80" y2="135" stroke="#e2e8f0" stroke-width="1"/>
  <text x="52" y="54" font-size="13" font-family="Arial, sans-serif" fill="#94a3b8" text-anchor="middle">0</text>
  <text x="52" y="89" font-size="13" font-family="Arial, sans-serif" fill="#3b82f6" text-anchor="middle" font-weight="600">1</text>
  <text x="52" y="124" font-size="13" font-family="Arial, sans-serif" fill="#94a3b8" text-anchor="middle">2</text>
  <text x="52" y="159" font-size="13" font-family="Arial, sans-serif" fill="#94a3b8" text-anchor="middle">3</text>
  <text x="110" y="28" font-size="11" font-family="Arial, sans-serif" fill="#64748b">hash("cat") % 4 = 1</text>
  <line x1="84" y1="82" x2="108" y2="82" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ab)"/>
  <rect x="112" y="66" width="120" height="32" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="172" y="87" font-size="13" font-family="Arial, sans-serif" fill="#1e40af" text-anchor="middle" font-weight="600">("cat", 9)</text>
  <text x="110" y="124" font-size="11" font-family="Arial, sans-serif" fill="#64748b">If key exists: update value</text>
  <text x="110" y="140" font-size="11" font-family="Arial, sans-serif" fill="#64748b">If key is new: append to chain</text>
  <text x="110" y="168" font-size="13" font-family="Arial, sans-serif" fill="#475569" font-weight="600">Collision example</text>
  <text x="110" y="184" font-size="11" font-family="Arial, sans-serif" fill="#64748b">hash("act") % 4 = 1</text>
  <line x1="236" y1="82" x2="270" y2="82" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="253" y="74" font-size="10" font-family="Arial, sans-serif" fill="#64748b" text-anchor="middle">chain</text>
  <rect x="274" y="66" width="120" height="32" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="334" y="87" font-size="13" font-family="Arial, sans-serif" fill="#15803d" text-anchor="middle">("act", 5)</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 z" fill="#64748b"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 z" fill="#3b82f6"/></marker>
  </defs>
</svg>

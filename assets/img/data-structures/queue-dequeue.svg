  <text x="208" y="36" font-size="11" font-family="Arial, sans-serif" fill="#64748b">rear</text>
  <line x1="224" y1="40" x2="224" y2="56" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

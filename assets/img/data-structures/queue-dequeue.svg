  <rect x="24" y="168" width="64" height="36" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="56" y="191" font-size="16" font-family="Arial, sans-serif" fill="#1e293b" text-anchor="middle">B</text>

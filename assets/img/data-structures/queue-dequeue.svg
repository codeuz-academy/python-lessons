<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 190" role="img" aria-label="Queue dequeue operation">
  <rect width="460" height="190" rx="8" fill="#f8fafc"/>
  <text x="24" y="18" font-size="12" font-family="Arial, sans-serif" fill="#94a3b8" font-weight="600">BEFORE</text>
  <text x="350" y="60" font-size="13" font-family="Arial, sans-serif" fill="#dc2626" font-weight="600">dequeue()</text>
  <text x="350" y="76" font-size="11" font-family="Arial, sans-serif" fill="#dc2626">returns A</text>
